    const LineString = (coordinates) => ({ type: 'Feature', geometry: { type: 'LineString', coordinates } });
    const Polygon = (coordinates) => ({ type: 'Feature', geometry: { type: 'Polygon', coordinates } });

    function bearing(p0, p1) {
        const lon1 = p0[0] * Math.PI / 180;
        const lat1 = p0[1] * Math.PI / 180;
        const lon2 = p1[0] * Math.PI / 180;
        const lat2 = p1[1] * Math.PI / 180;
        
        const dLon = lon2 - lon1;
        const y = Math.sin(dLon) * Math.cos(lat2);
        const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
        
        return Math.atan2(y, x) * 180 / Math.PI;
    }

    function snapBearingToOrtho(p0, p1) {
        const bearingValue = bearing(p0, p1);
        let min = Infinity;
        let snapped = 0;

        for (const a of [0, 90, 180, -90]) {
            let diff = Math.abs(bearingValue - a);
            if (diff > 180) {
                diff = 360 - diff;
            }
            if (diff < min) {
                min = diff;
                snapped = a;
            }
        }
        return snapped;
    }

    function orthoLineString(line) {
        const {coordinates} = line.geometry;
        const result = [coordinates[0]];

        for (let i = 1; i < coordinates.length; i++) {

            const p0 = result[result.length - 1];
            const p1 = coordinates[i];
            const snapped = snapBearingToOrtho(p0, p1);

            let newPoint;
            if (snapped === 0 || snapped === 180) {
                newPoint = [p0[0], p1[1]]; // vertical
            } else {
                newPoint = [p1[0], p0[1]]; // horizontal
            }
            result.push(newPoint);
        }
        return LineString(result);
    }

    function orthoPolygon(polygon) {
        const ring = polygon.geometry.coordinates[0];

        const line = LineString(ring.slice(0, -1));
        const orthoLine = orthoLineString(line);

        const {coordinates} = orthoLine.geometry;
        coordinates.push(coordinates[0]);
        return Polygon([coordinates]);
    }

    function ortogonalize(feature) {
        if (feature.geometry.type === 'LineString') {
            return orthoLineString(feature);
        } else if (feature.geometry.type === 'Polygon') {
            return orthoPolygon(feature);
        } else {
            throw new Error('Geometry type not supported for orthogonalization');
        }
    }

    const lineLayer = L.geoJSON(LINE).addTo(map);
    const lineOrtho = ortogonalize(LINE);

    L.geoJSON(lineOrtho, {
        style: {

            weight: 2,
            fillOpacity: 0.3
        }
    }).addTo(map);

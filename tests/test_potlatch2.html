    // Esempi di poligoni a scale diverse: piccolo, medio e molto esteso.
    const POLY = {
      "type": "FeatureCollection",
      "features": [
        {"type":"Feature","properties":{"name":"Piccolo"},"geometry":{"type":"Polygon","coordinates":[[[10.0000,45.8000],[10.0018,45.8002],[10.0021,45.8015],[10.0011,45.8020],[9.9998,45.8012],[10.0000,45.8000]]]}},
        {"type":"Feature","properties":{"name":"Medio"},"geometry":{"type":"Polygon","coordinates":[[[10.15,45.85],[10.19,45.855],[10.20,45.88],[10.17,45.90],[10.14,45.885],[10.15,45.85]]]}},
        {"type":"Feature","properties":{"name":"Esteso"},"geometry":{"type":"Polygon","coordinates":[[[9.7,45.5],[10.8,45.7],[11.5,46.1],[12.2,46.6],[11.7,47.0],[10.5,46.8],[9.8,46.2],[9.7,45.5]]]}}
      ]
    };

    // Porting del solver geometrico di Potlatch2 Quadrilateralise.as.
    // Le coordinate vengono trasformate in latp (Mercatore sferica), come in Potlatch2.
    function latToLatp(lat) {
      const r = Math.max(-89.999999, Math.min(89.999999, lat)) * Math.PI / 180;
      return 180 / Math.PI * Math.log(Math.tan(Math.PI / 4 + r / 2));
    }
    function latpToLat(y) {
      return 180 / Math.PI * (2 * Math.atan(Math.exp(y * Math.PI / 180)) - Math.PI / 2);
    }
    function scoreAt(a,b,c) {
      let px=a.x-b.x, py=a.y-b.y, qx=c.x-b.x, qy=c.y-b.y;
      const pl=Math.hypot(px,py), ql=Math.hypot(qx,qy);
      if (!pl || !ql) return Infinity;
      px/=pl; py/=pl; qx/=ql; qy/=ql;
      const d=px*qx+py*qy;
      return 2*Math.min(Math.abs(d-1),Math.abs(d),Math.abs(d+1));
    }
    function goodness(points) {
      let total=0, n=points.length;
      for(let i=0;i<n;i++) total+=scoreAt(points[(i+n-1)%n],points[i],points[(i+1)%n]);
      return total;
    }
    function potlatchStep(points) {
      const n=points.length;
      const moves=points.map((b,i)=>{
        const a=points[(i+n-1)%n], c=points[(i+1)%n];
        let px=a.x-b.x, py=a.y-b.y, qx=c.x-b.x, qy=c.y-b.y;
        const pl=Math.hypot(px,py), ql=Math.hypot(qx,qy);
        if(!pl || !ql) return {x:0,y:0};
        const scale=pl+ql;
        px/=pl; py/=pl; qx/=ql; qy/=ql;
        let dotp=px*qx+py*qy;
        if(dotp < -0.707106781186547) dotp+=1;
        const vx=px+qx, vy=py+qy, vl=Math.hypot(vx,vy);
        if(!vl) return {x:0,y:0};
        const amount=0.1*dotp*scale;
        return {x:vx/vl*amount,y:vy/vl*amount};
      });
      return points.map((p,i)=>({x:p.x+moves[i].x,y:p.y+moves[i].y}));
    }
    function quadrilateraliseRing(ring, maxIterations=1000, tolerance=1e-8) {
      if(!Array.isArray(ring) || ring.length<4) throw new Error('Anello non valido');
      const closed = ring.length>1 && ring[0][0]===ring[ring.length-1][0] && ring[0][1]===ring[ring.length-1][1];
      const pts=(closed?ring.slice(0,-1):ring).map(([x,y])=>({x,y:latToLatp(y)}));
      if(pts.length<3) throw new Error('Servono almeno tre vertici');
      let score=goodness(pts), iterations=0, rejected=false;
      for(let i=0;i<maxIterations;i++) {
        const next=potlatchStep(pts), nextScore=goodness(next);
        iterations=i+1;
        if(!Number.isFinite(nextScore) || nextScore>score) { rejected=true; break; }
        for(let j=0;j<pts.length;j++) pts[j]=next[j];
        score=nextScore;
        if(score<tolerance) break;
      }
      const result=rejected ? (closed?ring:ring.concat([ring[0]])) : pts.map(p=>[p.x,latpToLat(p.y)]);
      if(!rejected && result.length) result.push(result[0].slice());
      return {coordinates:result,score,iterations,rejected};
    }
    function orthogonalizePolygonFeature(feature) {
      let iterations=0, rejected=0, scores=[];
      const coordinates=feature.geometry.coordinates.map(ring=>{
        const r=quadrilateraliseRing(ring);
        iterations+=r.iterations; if(r.rejected) rejected++;
        scores.push(r.score); return r.coordinates;
      });
      return {feature:{...feature,geometry:{...feature.geometry,coordinates}},iterations,rejected,scores};
    }
    function orthogonalizeFeatureCollection(collection) {
      let iterations=0,rejected=0,scores=[];
      const features=collection.features.map(f=>{
        if(f.geometry.type!=='Polygon') throw new Error('Sono supportati solo elementi Polygon');
        const r=orthogonalizePolygonFeature(f);
        iterations+=r.iterations; rejected+=r.rejected; scores.push(...r.scores);
        return r.feature;
      });
      return {data:{...collection,features},iterations,rejected,scores};
    }

    const map = L.map('map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const lineLayer = L.geoJSON(LINE, {style:{color:'#2878c8',weight:2}}).addTo(map);
    const polyLayer = L.geoJSON(POLY, {style:{color:'#2878c8',weight:2,fillOpacity:0.08}}).addTo(map);
    let resultLayer = null;
    map.fitBounds(polyLayer.getBounds());

    document.getElementById('orthoBtn').addEventListener('click',()=>{
      try {
        if(resultLayer) map.removeLayer(resultLayer);
        const result=orthogonalizeFeatureCollection(POLY);
        resultLayer=L.geoJSON(result.data,{style:{color:'red',weight:2,fillOpacity:0.2}}).addTo(map);
        const mean=result.scores.length?result.scores.reduce((a,b)=>a+b,0)/result.scores.length:0;
        document.getElementById('orthoBtn').textContent=`Eseguito · ${result.iterations} iterazioni`;
        console.info('Potlatch2 orthogonalization', {iterations:result.iterations,rejectedRings:result.rejected,meanScore:mean,geojson:result.data});
      } catch(e) { alert('Errore: '+e.message); }
    });
